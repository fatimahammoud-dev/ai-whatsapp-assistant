[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"config/settings/dev.py" = ["F403", "F405"]
"config/settings/prod.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]