<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conversations</title>
</head>
<body>
    <h1>Conversations</h1>

    <p><a href="{% url 'dashboard' %}">Back to dashboard</a></p>

    <table>
        <thead>
            <tr>
                <th>Client</th>
                <th>Status</th>
                <th>Last message</th>
            </tr>
        </thead>
        <tbody>
            {% for conversation in conversations %}
                <tr>
                    <td>
                        <a href="{% url 'conversation-detail' conversation.pk %}">
                            {{ conversation.end_user }}
                        </a>
                    </td>
                    <td>{{ conversation.get_status_display }}</td>
                    <td>{{ conversation.last_message_at|date:"Y-m-d H:i" }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3">No conversations.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
