<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookings</title>
</head>
<body>
    <h1>Bookings</h1>

    <ul>
        {% for booking in bookings %}
            <li>
                {{ booking.tenant.business_name }}
                —
                {{ booking.scheduled_start }}
                —
                {{ booking.status }}
            </li>
        {% empty %}
            <li>No bookings found.</li>
        {% endfor %}
    </ul>
</body>
</html>
